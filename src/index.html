<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Sense UI</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="stylesheet" href="styles.css" />
    </head>

    <body>
        <!-- Skip link for keyboard/screen-reader users -->
        <a href="#main" class="skip-link">Skip to main content</a>
        <header>
            <h1 class="sr-only">Sense UI</h1>
            <nav>
                <a href="index.html" aria-current="page">Chat</a>
                <br />
                <a href="projects.html">Projects</a>
                <br />
                <a href="settings.html">Settings</a>
                <br />
                <a href="help.html">Help</a>
            </nav>
        </header>
        <main id="main">
            <section class="chat-container" aria-label="Chat interface">
                <div id="chat-messages" class="chat-messages" role="log"></div>
                <!-- Project Selector -->
                <section class="chat-controls" aria-label="Chat controls">
                    <div
                        id="persistent-nav-tip"
                        class="persistent-nav-tip"
                        role="note"
                        aria-label="Persistent panel navigation"
                        hidden
                    >
                        <p>
                            <strong>Persistent Mode:</strong> Press
                            <kbd>F6</kbd> or <kbd>Shift+F6</kbd> to cycle
                            between webpage and panel. Press
                            <kbd id="persistent-close-key">Ctrl+Shift+X</kbd> to
                            close.
                        </p>
                    </div>
                    <div
                        class="project-selector"
                        aria-labelledby="project-selector-label"
                    >
                        <label
                            for="active-project-select"
                            id="project-selector-label"
                            >Active Project</label
                        >
                        <select
                            id="active-project-select"
                            aria-describedby="project-selector-hint"
                        >
                            <option value="">No project selected</option>
                        </select>
                    </div>
                    <!-- Buttons container (hidden by default) -->
                    <div class="buttons-container">
                        <button
                            type="button"
                            id="describe-btn"
                            class="btn-secondary"
                        >
                            Describe webpage
                        </button>
                        <button
                            type="button"
                            id="issues-btn"
                            class="btn-secondary"
                        >
                            Find issues
                        </button>
                    </div>
                    <!-- Chat Input Area -->
                    <div class="chat-input-area" id="chat-form">
                        <label for="chat-input"
                            >Ask something about the page or use forward slash
                            for commands</label
                        >
                        <input
                            id="chat-input"
                            class="chat-input"
                            type="text"
                            list="command-list"
                            autocomplete="off"
                            autofocus
                        />
                        <datalist id="command-list">
                            <option value="/describe"></option>
                            <option value="/issues"></option>
                            <option value="/type"></option>
                            <option value="/color"></option>
                            <option value="/spacing"></option>
                            <option value="/alignment"></option>
                            <option value="/refresh"></option>
                            <option value="/clear"></option>
                        </datalist>
                        <button type="submit" class="chat-send btn-primary">
                            Send
                        </button>
                    </div>
                </section>
                <!-- Footer actions -->
                <footer class="chat-footer">
                    <button
                        type="button"
                        id="download-chat"
                        class="btn-tertiary"
                        aria-label="Download current chat as HTML file"
                    >
                        Download chat (HTML)
                    </button>
                    <button
                        type="button"
                        id="export-chat-json"
                        class="btn-tertiary"
                        aria-label="Export current chat in JSON format"
                    >
                        Export chat (JSON)
                    </button>
                    <button
                        type="button"
                        id="import-chat-btn"
                        class="btn-tertiary"
                        aria-label="Import chat from JSON file"
                    >
                        Import chat (JSON)
                    </button>
                    <input
                        type="file"
                        id="import-chat-input"
                        accept="application/json,.json"
                        style="display: none"
                        aria-hidden="true"
                    />
                    <a
                        href="https://github.com/reginacas/sense-ui/issues"
                        target="_blank"
                        rel="noopener"
                        class="btn-tertiary"
                        aria-label="Report issues in GitHub (opens in new tab)"
                        >Report issues in GitHub</a
                    >
                </footer>
            </section>

            <!-- Import Chat Confirmation Dialog -->
            <dialog id="import-chat-dialog">
                <h3>Import Chat</h3>
                <p tabindex="0" id="import-chat-dialog-text">
                    Choose how the imported chat should be applied.
                </p>
                <fieldset>
                    <legend>Import mode</legend>
                    <label for="import-chat-mode-replace">
                        <input
                            type="radio"
                            id="import-chat-mode-replace"
                            name="import-chat-mode"
                            value="replace"
                            checked
                        />
                        Replace current chat with imported chat
                    </label>
                    <br />
                    <label for="import-chat-mode-append">
                        <input
                            type="radio"
                            id="import-chat-mode-append"
                            name="import-chat-mode"
                            value="append"
                        />
                        Append imported chat to current chat
                    </label>
                </fieldset>
                <div class="dialog-actions">
                    <button
                        type="button"
                        id="cancel-import-chat"
                        class="btn-secondary"
                    >
                        Cancel
                    </button>
                    <button
                        type="button"
                        id="confirm-import-chat"
                        class="btn-primary"
                    >
                        Continue
                    </button>
                </div>
            </dialog>

            <!-- Live region for screen reader announcements -->
            <div
                id="chat-status"
                role="status"
                aria-live="polite"
                class="visually-hidden"
                aria-atomic="true"
            ></div>
        </main>
        <script src="export-import-utils.js"></script>
        <script src="script-bundled.js"></script>
    </body>
</html>
